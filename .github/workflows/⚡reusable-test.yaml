name: ⚡ Reusable Test

on:
  workflow_call:
    inputs:
      atomi_platform:
        required: true
        type: string
      atomi_service:
        required: true
        type: string

jobs:
  test:
    name: Test
    runs-on: ubuntu-22.04
    # Namespace runners (disabled):
    # runs-on:
    #   - nscloud-ubuntu-22.04-amd64-4x8-with-cache
    #   - nscloud-cache-size-50gb
    #   - nscloud-cache-tag-${{ inputs.atomi_platform }}-${{ inputs.atomi_service }}-nix-store-cache
    steps:
      # Setup
      - uses: AtomiCloud/actions.setup-nix@v2
        with:
          namespacelabs: 'false'
      - uses: AtomiCloud/actions.cache-bun@v1
        with:
          namespacelabs: 'false'

      # Test
      - name: Run tests
        run: nix develop .#ci -c ./scripts/ci/test.sh
